<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vivaha Cards — कनेक्शन नहीं</title>
  <style>
    :root { color-scheme: light }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAF7F8;
           font: 15px/1.55 Arial, Helvetica, sans-serif; color: #2B2226; padding: 24px }
    .c { max-width: 380px; text-align: center }
    .m { width: 60px; height: 60px; margin: 0 auto 18px; border-radius: 15px; background: #A81F52; color: #fff;
         display: grid; place-items: center; font-size: 25px; font-weight: 700; letter-spacing: -.5px }
    h1 { font-size: 19px; margin: 0 0 8px }
    p { margin: 0 0 18px; color: #6B5E64 }
    button { font: inherit; font-weight: 700; padding: 11px 22px; border: 0; border-radius: 9px;
             background: #A81F52; color: #fff; cursor: pointer }
  </style>
</head>
<body>
  <div class="c">
    <div class="m">VC</div>
    <h1>इंटरनेट कनेक्शन नहीं है</h1>
    <p>ऐप खुला रहेगा। कनेक्शन आने पर नीचे दबाएँ — आपका काम वहीं से चलेगा।<br /><span style="font-size:13px">No connection. Reconnect and retry.</span></p>
    <button onclick="location.reload()">दोबारा कोशिश करें · Retry</button>
  </div>
</body>
</html>
